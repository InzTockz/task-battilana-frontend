<div class="min-h-screen relative overflow-hidden flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-surface-50 via-brand-50 to-white">

    <!-- Decoraciones blur -->
    <div class="pointer-events-none absolute -top-32 -right-32 w-96 h-96 rounded-full bg-brand-300/30 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-sky-200/40 blur-3xl"></div>

    <div class="relative w-full max-w-md animate-scale-in">
        <div class="ui-card p-7 sm:p-9">

            <!-- Brand -->
            <div class="flex flex-col items-center mb-7 animate-fade-down">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 text-white flex items-center justify-center shadow-pop mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15L15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-surface-900">Tareas Battilana</h2>
                <p class="text-sm text-surface-500 mt-1">Inicia sesión para continuar</p>
            </div>

            <form class="space-y-4 stagger" (ngSubmit)="onLogin()">
                <div class="animate-fade-up">
                    <label class="ui-label">Correo</label>
                    <input type="email" [(ngModel)]="loginRequest.username" name="email"
                        class="ui-input"
                        placeholder="ejemplo@email.com" />
                </div>
                <div class="animate-fade-up">
                    <label class="ui-label">Contraseña</label>
                    <input type="password" [(ngModel)]="loginRequest.password" name="password"
                        class="ui-input"
                        placeholder="••••••••" />
                </div>
                <div class="flex items-center justify-between text-sm animate-fade-up">
                    <label class="flex items-center gap-2 cursor-pointer text-surface-600">
                        <input type="checkbox" class="rounded border-surface-300 text-brand-600 focus:ring-brand-500" />
                        <span>Recuérdame</span>
                    </label>
                    <a href="#" class="text-brand-600 hover:text-brand-700 font-medium">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit"
                    [disabled]="isLoading"
                    class="ui-btn-primary w-full py-3 text-sm animate-fade-up">
                    <span *ngIf="isLoading" class="loading loading-spinner loading-sm"></span>
                    <span *ngIf="!isLoading">Iniciar sesión</span>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-surface-500 hidden">
                ¿No tienes cuenta?
                <a routerLink="/register" class="text-brand-600 hover:text-brand-700 font-medium">Regístrate</a>
            </div>
        </div>

        <p class="text-center text-xs text-surface-400 mt-4 animate-fade-in">
            © {{ year }} Battilana · Gestión de tareas
        </p>
    </div>
</div>
