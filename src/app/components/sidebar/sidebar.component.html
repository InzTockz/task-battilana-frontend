<div class="flex min-h-screen bg-surface-50">

  <!-- Topbar mobile -->
  <header class="lg:hidden fixed top-0 inset-x-0 z-40 h-14 bg-white/90 backdrop-blur border-b border-surface-200 flex items-center justify-between px-4">
    <button (click)="openMobile()"
      class="w-10 h-10 inline-flex items-center justify-center rounded-xl hover:bg-surface-100 text-surface-700 transition-colors">
      <fa-icon [icon]="faBars" size="lg"></fa-icon>
    </button>
    <div class="flex items-center gap-2">
      <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 text-white flex items-center justify-center shadow-soft">
        <fa-icon [icon]="faChalkboardTeacher"></fa-icon>
      </span>
      <span class="text-surface-900 font-semibold">Tareas Battilana</span>
    </div>
    <div class="w-10"></div>
  </header>

  <!-- Backdrop mobile -->
  <div *ngIf="isMobileOpen()"
    (click)="closeMobile()"
    class="lg:hidden fixed inset-0 z-40 bg-surface-900/50 backdrop-blur-sm animate-fade-in">
  </div>

  <!-- Sidebar -->
  <aside
    [ngClass]="{
      'translate-x-0': !isMobile() || isMobileOpen(),
      '-translate-x-full': isMobile() && !isMobileOpen(),
      'lg:w-72': isLeftNavOpen(),
      'lg:w-20': !isLeftNavOpen()
    }"
    class="sidebar-gradient fixed lg:sticky top-0 left-0 z-50 h-screen w-72 shrink-0 flex flex-col py-5 px-3 transition-all duration-300 ease-out shadow-2xl lg:shadow-none">

    <!-- Brand -->
    <div class="flex items-center gap-3 h-12 mb-6 px-2">
      <span class="w-10 h-10 shrink-0 rounded-xl bg-white/10 text-white flex items-center justify-center ring-1 ring-white/20">
        <fa-icon [icon]="faChalkboardTeacher" size="lg"></fa-icon>
      </span>
      <span
        [ngClass]="{'lg:hidden': !isLeftNavOpen()}"
        class="text-white text-lg font-semibold tracking-tight whitespace-nowrap">
        Tareas Battilana
      </span>
      <button
        (click)="closeMobile()"
        class="lg:hidden ml-auto w-9 h-9 inline-flex items-center justify-center rounded-lg text-white/80 hover:bg-white/10">
        <fa-icon [icon]="faXmark"></fa-icon>
      </button>
    </div>

    <!-- Collapse toggle (desktop only) -->
    <button (click)="toggleSidebar()"
      class="hidden lg:flex absolute -right-3 top-10 w-7 h-7 items-center justify-center rounded-full bg-white border border-surface-200 text-brand-700 shadow-soft hover:shadow-card transition-all z-10">
      <fa-icon [icon]="faArrowLeft" [ngClass]="{'rotate-180': !isLeftNavOpen()}" class="transition-transform duration-300 text-xs"></fa-icon>
    </button>

    <!-- Nav items -->
    <nav class="flex flex-col gap-1 flex-1 overflow-y-auto mt-2">
      <a
        [routerLink]="homeUsers.route"
        (click)="isButtonSiderSelected('1')"
        [ngClass]="{'active': isButtonSelected=='1', 'lg:justify-center': !isLeftNavOpen()}"
        class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/85 hover:text-white hover:bg-white/10 cursor-pointer">
        <fa-icon [icon]="homeUsers.icon" class="shrink-0 w-5 text-center"></fa-icon>
        <span [ngClass]="{'lg:hidden': !isLeftNavOpen()}" class="text-sm font-medium whitespace-nowrap">{{homeUsers.label}}</span>
      </a>

      <a
        [routerLink]="fileUsers.route"
        (click)="isButtonSiderSelected('2')"
        [ngClass]="{'active': isButtonSelected=='2', 'lg:justify-center': !isLeftNavOpen(), 'hidden': !isAdmin()}"
        class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/85 hover:text-white hover:bg-white/10 cursor-pointer">
        <fa-icon [icon]="fileUsers.icon" class="shrink-0 w-5 text-center"></fa-icon>
        <span [ngClass]="{'lg:hidden': !isLeftNavOpen()}" class="text-sm font-medium whitespace-nowrap">{{fileUsers.label}}</span>
      </a>

      <a
        [routerLink]="userManager.route"
        (click)="isButtonSiderSelected('3')"
        [ngClass]="{'active': isButtonSelected=='3', 'lg:justify-center': !isLeftNavOpen(), 'hidden': !isAdmin()}"
        class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/85 hover:text-white hover:bg-white/10 cursor-pointer">
        <fa-icon [icon]="userManager.icon" class="shrink-0 w-5 text-center"></fa-icon>
        <span [ngClass]="{'lg:hidden': !isLeftNavOpen()}" class="text-sm font-medium whitespace-nowrap">{{userManager.label}}</span>
      </a>
    </nav>

    <!-- Logout -->
    <div class="pt-3 border-t border-white/10">
      <a (click)="logoutUser()"
        [ngClass]="{'lg:justify-center': !isLeftNavOpen()}"
        class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/85 hover:text-white hover:bg-white/10 cursor-pointer">
        <fa-icon [icon]="navLogout.icon" class="shrink-0 w-5 text-center"></fa-icon>
        <span [ngClass]="{'lg:hidden': !isLeftNavOpen()}" class="text-sm font-medium whitespace-nowrap">{{navLogout.label}}</span>
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 min-w-0 h-screen overflow-y-auto pt-14 lg:pt-0">
    <div class="route-enter">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
